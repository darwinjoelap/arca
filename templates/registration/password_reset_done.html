{% extends "base.html" %}

{% block titulo %}Correo enviado — Arca{% endblock %}

{% block contenido %}
<div class="card card-arca p-4 text-center">
  <i class="bi bi-envelope-check-fill text-success" style="font-size: 2.5rem;"></i>
  <h1 class="h4 my-3">Revisa tu correo</h1>
  <p class="text-muted">
    Si existe una cuenta con ese correo, te enviamos las instrucciones para
    restablecer tu contraseña.
  </p>
  <a href="{% url 'login' %}" class="btn btn-arca-primary">Volver a iniciar sesión</a>
</div>
{% endblock %}
