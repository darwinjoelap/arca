{% extends "base.html" %}
{% block titulo %}Sin conexión — Arca{% endblock %}
{% block titulo_topbar %}Sin conexión{% endblock %}
{% block contenido %}
<div class="text-center py-5">
  <i class="bi bi-wifi-off d-block mb-3" style="font-size: 3rem; color: var(--arca-brass-500);"></i>
  <h1 class="h4 mb-2">Sin conexión</h1>
  <p class="text-muted mb-4 mx-auto" style="max-width: 460px;">
    No se pudo cargar esta página porque no hay conexión a internet.
    Revisa tu conexión e inténtalo de nuevo.
  </p>
  <button type="button" onclick="window.location.reload()" class="btn btn-arca-primary">
    <i class="bi bi-arrow-clockwise"></i> Reintentar
  </button>
</div>
{% endblock %}
