{% extends "base.html" %}
{% block titulo %}Datos de la organización — Arca{% endblock %}
{% block titulo_topbar %}Datos de la organización{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4">Datos de la organización</h1>
<div class="card card-arca" style="max-width: 560px;">
  <div class="card-body p-4">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "organizaciones/_form_campos.html" %}
      <button type="submit" class="btn btn-arca-primary">Guardar</button>
      <a href="{% url 'organizaciones:configuracion' %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
